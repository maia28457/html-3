<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1 id="titulo">Meu Blog</h1>
    </header>

    <main>
        <p class="texto">Primeiro parágrafo do blog.</p>
        <p class="texto">Segundo parágrafo do blog.</p>
        <p class="texto">Terceiro parágrafo do blog.</p>

        <button id="botao" type="button">Clique aqui</button>

        <div class="campo">
            <label for="nome">Seu nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <h2>Minha lista</h2>
        <ul id="lista">
            <li>Item do HTML 1</li>
            <li>Item do HTML 2</li>
            <li>Item do HTML 3</li>
        </ul>

        <form id="formulario">
            <input type="text" id="tarefa" placeholder="Digite uma nova tarefa">
            <button type="submit">Adicionar</button>
        </form>
    </main>
</body>
</html>
